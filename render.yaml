# Render.com configuration (for future production deployment)
# This file is for reference only and should not be used for local development

services:
  # Backend API Service
  - type: web
    name: oimoqr-backend
    env: node
    region: ohio
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_VERSION
        value: 20.19.0
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FINIK_API_KEY
        sync: false
      - key: FINIK_ACCOUNT_ID
        sync: false
      - key: FINIK_PRIVATE_KEY
        sync: false
      - key: FINIK_PUBLIC_KEY
        sync: false
      - key: FINIK_WEBHOOK_URL
        sync: false
      - key: FINIK_MODE
        value: prod
      - key: FINIK_MERCHANT_NAME
        value: OimoQR
      - key: FINIK_PAYMENT_TTL_MINUTES
        value: 30
      - key: FINIK_SETTLEMENT_GRACE_MINUTES
        value: 1440
      - key: FINIK_WEBHOOK_TOLERANCE_SECONDS
        value: 300
      - key: FINIK_REQUEST_TIMEOUT_MS
        value: 10000
