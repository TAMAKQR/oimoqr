name: CI - Build & Validate

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: 🔍 Validate & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --- Backend ---
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🗄️ Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate

      - name: 🔧 Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: ✅ Backend Syntax Check
        working-directory: ./backend
        run: node --check src/server.js

      # --- Frontend ---
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Frontend
        working-directory: ./frontend
        run: npx vite build
        env:
          NODE_ENV: production

      - name: 📊 Check Bundle Size
        working-directory: ./frontend
        run: |
          SIZE=$(du -sh dist | cut -f1)
          echo "📦 Bundle size: $SIZE"
          # Fail if dist is over 15MB
          SIZE_KB=$(du -s dist | cut -f1)
          if [ "$SIZE_KB" -gt 15360 ]; then
            echo "❌ Bundle too large: $SIZE (>15MB)"
            exit 1
          fi

      - name: ✅ All checks passed
        run: echo "🟢 Ready to deploy!"

  # Блокируем деплой на prod если проверки не прошли
  deploy-gate:
    name: 🚦 Deploy Gate
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🟢 Production deploy approved
        run: echo "✅ All checks passed. Vercel/Render will auto-deploy."
